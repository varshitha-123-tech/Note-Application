<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; }

        #sidebar { width: 280px; border-right: 1px solid #ccc; padding: 15px; overflow-y: auto; box-sizing: border-box; }
        #sidebar h3 { margin-top: 0; }
        #userBar { font-size: 13px; color: #555; margin-bottom: 12px; }
        #userBar button { margin-left: 8px; cursor: pointer; }
        .noteItem { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .noteItem:hover { background: #f5f5f5; }
        .itemTitle { font-weight: bold; display: block; }
        .itemPreview { font-size: 12px; color: #666; display: block; }
        .itemMeta { font-size: 11px; color: #999; display: block; margin-top: 2px; }

        #mainArea { flex: 1; padding: 20px; box-sizing: border-box; }
        #noteForm { display: flex; flex-direction: column; gap: 10px; max-width: 500px; }
        #noteForm input, #noteForm textarea { padding: 8px; font-size: 14px; }
        #noteForm button { padding: 8px; cursor: pointer; width: fit-content; }
        .formButtons { display: flex; gap: 10px; }
        #message { font-size: 14px; min-height: 18px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>My Notes</h3>
    <div id="userBar">
        <span id="userLabel"></span>
        <button onclick="logout()">Logout</button>
    </div>
    <div id="notesList"></div>
</div>

<div id="mainArea">
    <h2 id="formHeading">New Note</h2>
    <div id="noteForm">
        <input type="text" id="titleInput" placeholder="Title">
        <input type="text" id="categoryInput" placeholder="Category (e.g. Work)">
        <textarea id="contentInput" placeholder="Content" rows="6"></textarea>
        <div class="formButtons">
            <button id="saveButton" onclick="createNote()">Add Note</button>
            <button id="deleteButton" onclick="deleteCurrentNote()" style="display:none;">Delete</button>
            <button id="newButton" onclick="resetForm()" style="display:none;">+ New Note</button>
        </div>
        <div id="message"></div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080";
    const currentUser = localStorage.getItem("username");

    // Not logged in -> go to the login page
    if (!currentUser) {
        window.location.href = "login.html";
    }

    document.getElementById("userLabel").textContent = "Logged in as " + currentUser;

    let editingId = null;

    function logout() {
        localStorage.removeItem("username");
        window.location.href = "login.html";
    }

    function showMessage(text, isError) {
        const box = document.getElementById("message");
        box.textContent = text;
        box.style.color = isError ? "red" : "green";
    }

    function errorText(status) {
        if (status === 400) return "Owner is required, or that user does not exist.";
        if (status === 503) return "User service is unavailable. Try again later.";
        return "Something went wrong (status " + status + ").";
    }

    async function loadNotes() {
        const response = await fetch(`${API_BASE}/Notes/owner/${encodeURIComponent(currentUser)}`);
        const notes = await response.json();

        const listDiv = document.getElementById("notesList");
        listDiv.innerHTML = "";

        notes.forEach(note => {
            const item = document.createElement("div");
            item.className = "noteItem";

            const title = document.createElement("span");
            title.className = "itemTitle";
            title.textContent = note.title || "(untitled)";

            const content = note.content || "";
            const preview = document.createElement("span");
            preview.className = "itemPreview";
            preview.textContent = content.length > 30 ? content.substring(0, 30) + "..." : content;

            const parts = [];
            if (note.category) parts.push(note.category);
            if (note.updateAt) parts.push(new Date(note.updateAt).toLocaleString());
            const meta = document.createElement("span");
            meta.className = "itemMeta";
            meta.textContent = parts.join(" · ");

            item.append(title, preview, meta);
            item.onclick = () => openNote(note);
            listDiv.appendChild(item);
        });
    }

    function openNote(note) {
        editingId = note.id;
        document.getElementById("titleInput").value = note.title || "";
        document.getElementById("contentInput").value = note.content || "";
        document.getElementById("categoryInput").value = note.category || "";
        document.getElementById("formHeading").textContent = "Edit Note";
        document.getElementById("message").textContent = "";

        document.getElementById("saveButton").textContent = "Update Note";
        document.getElementById("saveButton").setAttribute("onclick", "updateNote()");
        document.getElementById("deleteButton").style.display = "inline-block";
        document.getElementById("newButton").style.display = "inline-block";
    }

    function resetForm() {
        editingId = null;
        document.getElementById("titleInput").value = "";
        document.getElementById("contentInput").value = "";
        document.getElementById("categoryInput").value = "";
        document.getElementById("formHeading").textContent = "New Note";
        document.getElementById("message").textContent = "";

        document.getElementById("saveButton").textContent = "Add Note";
        document.getElementById("saveButton").setAttribute("onclick", "createNote()");
        document.getElementById("deleteButton").style.display = "none";
        document.getElementById("newButton").style.display = "none";
    }

    async function createNote() {
        const title = document.getElementById("titleInput").value.trim();
        const content = document.getElementById("contentInput").value.trim();
        const category = document.getElementById("categoryInput").value.trim();

        if (!title) { showMessage("Title is required.", true); return; }

        const response = await fetch(`${API_BASE}/Note`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: title, content: content, category: category, owner: currentUser })
        });

        if (!response.ok) { showMessage(errorText(response.status), true); return; }

        resetForm();
        loadNotes();
        showMessage("Note saved.", false);
    }

    async function updateNote() {
        const title = document.getElementById("titleInput").value.trim();
        const content = document.getElementById("contentInput").value.trim();
        const category = document.getElementById("categoryInput").value.trim();

        const response = await fetch(`${API_BASE}/notes/${editingId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: title, content: content, category: category })
        });

        if (!response.ok) { showMessage(errorText(response.status), true); return; }

        resetForm();
        loadNotes();
        showMessage("Note updated.", false);
    }

    async function deleteCurrentNote() {
        if (editingId === null) return;

        const response = await fetch(`${API_BASE}/notes/${editingId}`, { method: "DELETE" });
        if (!response.ok) { showMessage(errorText(response.status), true); return; }

        resetForm();
        loadNotes();
        showMessage("Note deleted.", false);
    }

    if (currentUser) loadNotes();
</script>

</body>
</html>
